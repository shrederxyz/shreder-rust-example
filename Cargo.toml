[package]
name = "shreder-client-example"
version = "0.1.0"
edition = "2021"

[[example]]
name = "entries"
path = "src/examples/entries/main.rs"

[[example]]
name = "transactions"
path = "src/examples/transactions/main.rs"

[[example]]
name = "binary"
path = "src/examples/binary/main.rs"

[[example]]
name = "preconf"
path = "src/examples/preconf/main.rs"

[dependencies]
futures = "0.3.24"
solana-hash = { version = "=4.7.0", features = ["wincode"] }
solana-transaction = { version = "=6.0.0", features = ["wincode"] }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.10", features = ["tls", "tls-roots", "tls-webpki-roots"] }
maplit = "1.0.2"
prost = "0.12"
prost-types = "0.12"
protobuf-src = "1"
bs58 = "0.4"
wincode = { version = "0.6", features = ["derive"] }

[build-dependencies]
protobuf-src = "1"
tonic-build = "0.10"
